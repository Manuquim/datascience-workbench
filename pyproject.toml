[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "datascience-workbench"
version = "0.1.0"
description = "Local-first, reproducible data preparation and visualization workbench"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.143.0", "uvicorn==0.54.0", "duckdb==1.5.6",
  "plotly==7.1.0", "httpx==0.28.1", "python-multipart==0.0.32",
  "openpyxl==3.1.5", "python-dotenv==1.2.4", "defusedxml==0.7.1"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff>=0.14,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
